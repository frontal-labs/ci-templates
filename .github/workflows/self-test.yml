# Lints and checks for this repo. Runs on every PR and on pushes to main.
name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: .github/workflows/*.yml

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check zizmor==1.32.0
      - name: Audit workflows
        run: zizmor --format plain .github/workflows/

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint scripts
        run: shellcheck scripts/*.sh

  config:
    # Needs REPORTS_TOKEN, which fork PRs do not receive.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate repos.json against schema and org
        env:
          GH_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        run: scripts/validate-config.sh

  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that every third-party action is pinned to a full SHA
        run: |
          status=0
          # Local (./) and this repo's own reusable workflows are exempt.
          while IFS= read -r line; do
            ref="${line#*uses:}"
            ref="${ref#"${ref%%[![:space:]]*}"}"
            ref="${ref%%[[:space:]]*}"
            case "$ref" in
              ./*|frontal-labs/ci-templates/*) continue ;;
            esac
            if [[ ! "$ref" =~ @[0-9a-f]{40}$ ]]; then
              echo "::error file=${line%%:*}::not pinned to a 40-char SHA: $ref"
              status=1
            fi
          done < <(grep -rn --include='*.yml' -E '^[[:space:]]*(- )?uses:' .github/workflows/ || true)
          exit "$status"
